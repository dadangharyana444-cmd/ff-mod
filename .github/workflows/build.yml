name: Build Android .so

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download and Setup Android NDK
        run: |
          echo "Mengunduh Android NDK..."
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          echo "Mengekstrak NDK..."
          unzip -q android-ndk-r26b-linux.zip
          echo "NDK siap digunakan."

      - name: Compile Shared Library
        run: |
          # Kompilasi langsung menggunakan NDK resmi yang baru diunduh
          ./android-ndk-r26b-linux/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ \
          -shared -fPIC ff_combat_patch.cpp \
          -o libcombat_patch.so \
          -llog -O3
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: combat-lib
          path: libcombat_patch.so
          
