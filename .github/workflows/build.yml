name: Build Android .so

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v3
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Compile Shared Library
        run: |
          # Perintah kompilasi clang NDK untuk arsitektur arm64-v8a
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ \
          -shared -fPIC ff_combat_patch.cpp \
          -o libcombat_patch.so \
          -llog -O3
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: combat-lib
          path: libcombat_patch.so
          
